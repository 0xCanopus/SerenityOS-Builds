name: "Build SerenityOS ISO"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone SerenityOS
        run: |
          git clone --depth=1 --single-branch https://github.com/SerenityOS/serenity.git
          cd serenity
          SERENITY_COMMIT=$(git rev-parse --short HEAD)
          echo "SERENITY_COMMIT=${SERENITY_COMMIT}" >> $GITHUB_ENV

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            curl libmpfr-dev libmpc-dev libgmp-dev \
            e2fsprogs qemu-utils rsync unzip texinfo \
            libssl-dev zlib1g-dev fuse2fs genisoimage \
            grub-pc-bin grub-common mtools parted xorriso \
            g++-15 gcc-15

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: serenity-ccache-${{ runner.os }}-${{ env.SERENITY_COMMIT }}
          restore-keys: |
            serenity-ccache-${{ runner.os }}-

      - name: Configure Ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

      - name: Build Bootable ISO Image
        working-directory: serenity
        env:
          SERENITY_ARCH: x86_64
        run: |
          # 1. Build the system components (kernel, rootfs, limine binaries)
          Meta/serenity.sh image

          # 2. Set up the ISO staging folder
          ISO_ROOT="Build/x86_64/iso_root"
          rm -rf "${ISO_ROOT}"
          mkdir -p "${ISO_ROOT}/boot/limine"

          # 3. Copy the kernel, initrd, and boot configuration from the build output
          cp Build/x86_64/Root/boot/Kernel.bin "${ISO_ROOT}/boot/"
          [ -f Build/x86_64/Root/boot/initrd.img ] && cp Build/x86_64/Root/boot/initrd.img "${ISO_ROOT}/boot/"

          # Copy Limine stage files and config
          # Serenity downloads and builds Limine inside the build tree
          LIMINE_DIR=$(find Build/x86_64 -type d -name "limine" | head -n 1)
          cp "${LIMINE_DIR}/limine-bios.sys" "${ISO_ROOT}/boot/limine/"
          cp "${LIMINE_DIR}/limine-bios-cd.bin" "${ISO_ROOT}/boot/limine/"
          cp "${LIMINE_DIR}/limine-uefi-cd.bin" "${ISO_ROOT}/boot/limine/" 2>/dev/null || true

          # Create the Limine bootloader configuration
          cat << 'EOF' > "${ISO_ROOT}/boot/limine/limine.conf"
          timeout: 3

          /SerenityOS
              protocol: limine
              kernel_path: boot():/boot/Kernel.bin
              kernel_cmdline: boot_mode=graphical
          EOF

          # 4. Generate the ISO using xorriso
          OUTPUT_NAME="serenity-x86_64-${{ env.SERENITY_COMMIT }}.iso"
          xorriso -as mkisofs \
            -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine/limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            "${ISO_ROOT}" -o "../${OUTPUT_NAME}"

          # 5. Embed the Limine MBR to make it a hybrid ISO (bootable via CD and USB)
          "${LIMINE_DIR}/limine" bios-install "../${OUTPUT_NAME}"

          cd ..
          gzip -9 "${OUTPUT_NAME}"
          echo "RELEASE_ARTIFACT=${OUTPUT_NAME}.gz" >> $GITHUB_ENV


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "serenity-${{ env.SERENITY_COMMIT }}"
          name: "SerenityOS Build (${{ env.SERENITY_COMMIT }})"
          body: |
            Automated build of SerenityOS.
            Upstream commit: [SerenityOS/serenity@${{ env.SERENITY_COMMIT }}](https://github.com/SerenityOS/serenity/commit/${{ env.SERENITY_COMMIT }})
          files: ${{ env.RELEASE_ARTIFACT }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
