name: "Build SerenityOS ISO"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone SerenityOS
        run: |
          git clone --depth=1 --single-branch https://github.com/SerenityOS/serenity.git
          cd serenity
          SERENITY_COMMIT=$(git rev-parse --short HEAD)
          echo "SERENITY_COMMIT=${SERENITY_COMMIT}" >> $GITHUB_ENV

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            curl libmpfr-dev libmpc-dev libgmp-dev \
            e2fsprogs qemu-utils rsync unzip texinfo \
            libssl-dev zlib1g-dev fuse2fs genisoimage \
            grub-pc-bin grub-common mtools parted xorriso \
            gcc-15 g++-15 \
            clang llvm lld

          # Ensure gcc/g++ default to version 15
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-15

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: serenity-ccache-${{ runner.os }}-${{ env.SERENITY_COMMIT }}
          restore-keys: |
            serenity-ccache-${{ runner.os }}-

      - name: Configure Ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache -z

      - name: Build Limine Disk Image
        working-directory: serenity
        env:
          SERENITY_ARCH: x86_64
          SERENITY_RUN: limine
          SERENITY_TOOLCHAIN: GNU
          CC: gcc-15
          CXX: g++-15
        run: |
          Meta/serenity.sh image

      - name: Package El Torito Bootable ISO
        working-directory: serenity
        run: |
          IMAGE_PATH=$(find Build/x86_64 -maxdepth 1 -type f \( -name "limine_disk_image" -o -name "_disk_image" \) | head -n 1)

          if [ -z "${IMAGE_PATH}" ]; then
            echo "::error::Disk image not found in Build/x86_64/"
            exit 1
          fi

          echo "Found disk image at: ${IMAGE_PATH}"
          OUTPUT_ISO="serenity-limine-x86_64-${{ env.SERENITY_COMMIT }}.iso"

          xorriso -as mkisofs \
            -o "../${OUTPUT_ISO}" \
            -hard-disk-boot \
            -b "$(basename ${IMAGE_PATH})" \
            -no-emul-boot \
            "${IMAGE_PATH}"

          echo "OUTPUT_ISO=${OUTPUT_ISO}" >> $GITHUB_ENV

      - name: Compress ISO Artifact
        run: |
          gzip -9 "${OUTPUT_ISO}"
          echo "RELEASE_ARTIFACT=${OUTPUT_ISO}.gz" >> $GITHUB_ENV

      - name: Show Ccache Statistics
        run: |
          ccache -s

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "serenity-${{ env.SERENITY_COMMIT }}"
          name: "SerenityOS Build (${{ env.SERENITY_COMMIT }})"
          body: |
            Automated build of SerenityOS.
            Upstream commit: [SerenityOS/serenity@${{ env.SERENITY_COMMIT }}](https://github.com/SerenityOS/serenity/commit/${{ env.SERENITY_COMMIT }})
          files: ${{ env.RELEASE_ARTIFACT }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
