name: "Build SerenityOS ISO"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone SerenityOS
        run: |
          git clone --depth=1 --single-branch https://github.com/SerenityOS/serenity.git
          cd serenity
          SERENITY_COMMIT=$(git rev-parse --short HEAD)
          echo "SERENITY_COMMIT=${SERENITY_COMMIT}" >> $GITHUB_ENV

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            curl libmpfr-dev libmpc-dev libgmp-dev \
            e2fsprogs qemu-utils rsync unzip texinfo \
            libssl-dev zlib1g-dev fuse2fs genisoimage \
            grub-pc-bin grub-common mtools parted xorriso \
            g++-15 gcc-15

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: serenity-ccache-${{ runner.os }}-${{ env.SERENITY_COMMIT }}
          restore-keys: |
            serenity-ccache-${{ runner.os }}-

      - name: Configure Ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

      - name: Build Bootable ISO
        working-directory: serenity
        env:
          SERENITY_ARCH: x86_64
          SERENITY_RUN: limine
        run: |
          # 1. Build the Limine-targeted image
          Meta/serenity.sh image

          # 2. Locate the raw disk image
          IMAGE_FILE=$(find Build/x86_64 -maxdepth 1 -type f \( -name "limine_disk_image" -o -name "_disk_image" \) | head -n 1)

          if [ -z "${IMAGE_FILE}" ]; then
            echo "Error: Disk image not found in Build/x86_64/"
            exit 1
          fi

          OUTPUT_ISO="serenity-limine-x86_64-${{ env.SERENITY_COMMIT }}.iso"

          # 3. Wrap the full image into an El Torito bootable ISO
          xorriso -as mkisofs \
            -o "../${OUTPUT_ISO}" \
            -hard-disk-boot \
            -b "$(basename ${IMAGE_FILE})" \
            -no-emul-boot \
            "${IMAGE_FILE}"

          # 4. Compress for GitHub release limits and upload speed
          cd ..
          gzip -9 "${OUTPUT_ISO}"
          echo "RELEASE_ARTIFACT=${OUTPUT_ISO}.gz" >> $GITHUB_ENV


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "serenity-${{ env.SERENITY_COMMIT }}"
          name: "SerenityOS Build (${{ env.SERENITY_COMMIT }})"
          body: |
            Automated build of SerenityOS.
            Upstream commit: [SerenityOS/serenity@${{ env.SERENITY_COMMIT }}](https://github.com/SerenityOS/serenity/commit/${{ env.SERENITY_COMMIT }})
          files: ${{ env.RELEASE_ARTIFACT }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
